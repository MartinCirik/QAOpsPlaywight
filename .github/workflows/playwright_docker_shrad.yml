name: Playwright Docker Sharding Tests
on:
  push:
    branches: [ main, master, septCut, feature/sharding ]
  pull_request:
    branches: [ main, master, feature/sharding ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (shard)
        run: >
          npx playwright test --config=playwright.config.js --workers=4
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1
